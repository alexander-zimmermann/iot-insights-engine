[project]
name = "iot-insights-engine"
version = "1.19.0"
description = "TSDB-backed background jobs: external forecast pulls (Forecast.Solar, Open-Meteo) and the daily energy balance. Companion to iot-mcp-bridge — owns all writes to mcp_forecasts."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.13"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "jsonschema>=4.26.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "nats-py[nkeys]>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "types-jsonschema",
    "types-PyYAML",
    "pre-commit>=4.6.2",
]

[project.scripts]
iot-insights-engine = "iot_insights_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_insights_engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# psycopg's dict_row factory returns dicts at runtime but the stubs
# don't express that. Same disable-set as iot-mcp-bridge had.
module = [
    "iot_insights_engine.db_write",
]
disable_error_code = ["call-overload", "attr-defined", "index", "dict-item", "assignment", "arg-type"]

[[tool.mypy.overrides]]
# nats-py doesn't publish PEP 561 stubs.
module = ["nats"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportAttributeAccessIssue = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
